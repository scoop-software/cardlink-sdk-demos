name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-published:
    name: Android (published)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Build assembleDebug (resolves SDK from GitHub Packages Maven)
        working-directory: android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleDebug --no-daemon --info

      - name: Verify SDK was resolved from Maven (not local source)
        working-directory: android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > /tmp/deps.txt
          if grep -q "project :" /tmp/deps.txt; then
            echo "ERROR: SDK resolved as local project, not Maven dependency."
            cat /tmp/deps.txt
            exit 1
          fi
          if ! grep -q "de.scoopsoftware.cardlink:shared-android:" /tmp/deps.txt; then
            echo "ERROR: Cardlink SDK not in dependency tree."
            cat /tmp/deps.txt
            exit 1
          fi
          echo "OK: SDK resolved from Maven."

      - name: Upload APK as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
