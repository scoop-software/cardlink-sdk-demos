name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-published:
    name: Android (published)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Build assembleDebug (resolves SDK from GitHub Packages Maven)
        working-directory: android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          # The default workflow GITHUB_TOKEN is scoped to this repo only and can't read
          # packages from the sibling SDK repos. MAVEN_READ_TOKEN is a PAT (or fine-grained
          # token) with read:packages scope on the scoop-software org.
          GITHUB_TOKEN: ${{ secrets.MAVEN_READ_TOKEN }}
        run: ./gradlew assembleDebug --no-daemon --info

      - name: Verify SDK was resolved from Maven (not local source)
        working-directory: android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          # The default workflow GITHUB_TOKEN is scoped to this repo only and can't read
          # packages from the sibling SDK repos. MAVEN_READ_TOKEN is a PAT (or fine-grained
          # token) with read:packages scope on the scoop-software org.
          GITHUB_TOKEN: ${{ secrets.MAVEN_READ_TOKEN }}
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > /tmp/deps.txt
          if grep -q "project :" /tmp/deps.txt; then
            echo "ERROR: SDK resolved as local project, not Maven dependency."
            cat /tmp/deps.txt
            exit 1
          fi
          if ! grep -q "de.scoopsoftware.cardlink:shared-android:" /tmp/deps.txt; then
            echo "ERROR: Cardlink SDK not in dependency tree."
            cat /tmp/deps.txt
            exit 1
          fi
          echo "OK: SDK resolved from Maven."

      - name: Upload APK as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios-published:
    name: iOS (published)
    runs-on: macos-26
    timeout-minutes: 30
    # Known issue: Xcode 26's explicit modules + SKIE-generated swiftinterface
    # interact such that cross-module enum types (ApduColor / AuthMethod /
    # LeiSelectionMethod / ErezeptType — declared in both ScoopCardlink and
    # ScoopNfc via Kotlin typealias re-exports) fail to resolve. The fix
    # needs to land in the SDK (drop the cross-module typealiases in
    # cardlink-sdk's NfcReExports.kt) or in SKIE itself. Tracked as a
    # Phase 2 follow-up.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SPM packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project CardlinkDemo.xcodeproj

      - name: Build CardlinkDemo for iOS Simulator
        working-directory: ios
        run: |
          xcodebuild -project CardlinkDemo.xcodeproj \
            -scheme CardlinkDemo \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Verify ScoopCardlink + ScoopNfc resolved from cardlink-packages
        working-directory: ios
        run: |
          RESOLVED=CardlinkDemo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          for pkg in cardlink-packages; do
            if ! grep -q "$pkg" "$RESOLVED"; then
              echo "ERROR: $pkg not found in Package.resolved"
              cat "$RESOLVED" || true
              exit 1
            fi
          done
          echo "OK: SPM resolution verified."

  ios-projects-in-sync:
    name: iOS projects in sync
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install xcodeproj gem
        run: gem install xcodeproj

      - name: Check CardlinkDemo and CardlinkDemoDev are in sync
        run: ruby scripts/sync-ios-projects.rb --check
