[versions]
agp = "8.7.2"
kotlin = "2.3.10"
compose-bom = "2025.03.01"
kotlinx-coroutines = "1.10.2"

# SDK pins — update with scripts/update-sdk-pin.sh after publishing a release.
# Verify against latest published versions in Step 2 before committing.
cardlink-sdk = "2.6.2"
nfc-sdk = "2.3.2"
popp-module = "0.20.2"

[libraries]
# AndroidX core
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.6.1" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version = "1.8.2" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.3" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.1.4" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.7.0" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.8.7" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.8.5" }

# Compose BOM-managed
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# CameraX
camerax-core = { module = "androidx.camera:camera-core", version = "1.3.1" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version = "1.3.1" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version = "1.3.1" }
camerax-view = { module = "androidx.camera:camera-view", version = "1.3.1" }

# ML Kit
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version = "16.0.0" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version = "17.3.0" }

# Material
material = { module = "com.google.android.material:material", version = "1.11.0" }

# Vico charts
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version = "1.13.1" }

# Misc
gson = { module = "com.google.code.gson:gson", version = "2.10.1" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version = "6.3.0" }
coil-compose = { module = "io.coil-kt:coil-compose", version = "2.5.0" }
coil-svg = { module = "io.coil-kt:coil-svg", version = "2.5.0" }
security-crypto = { module = "androidx.security:security-crypto", version = "1.1.0-alpha06" }
credentials = { module = "androidx.credentials:credentials", version = "1.3.0" }
credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version = "1.3.0" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# Scoop SDKs — published artifacts (Maven coordinates)
cardlink-shared-android = { module = "de.scoopsoftware.cardlink:shared-android", version.ref = "cardlink-sdk" }
nfc-shared-android = { module = "de.scoopsoftware.nfc:shared-android", version.ref = "nfc-sdk" }
popp-shared-android = { module = "de.scoopsoftware.popp:shared-android", version.ref = "popp-module" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
